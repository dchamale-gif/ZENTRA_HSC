<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#ffffff">
    <title>Login - Zentra MED</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --ink: #0b1220;
            --text: #1e293b;
            --muted: #5b6678;
            --subtle: #8a94a6;
            --bg: #ffffff;
            --bg-alt: #f6f8fb;
            --border: #e4e8ef;
            --border-strong: #d3d9e3;
            --primary: #1d5bd8;
            --primary-hover: #1749b0;
            --primary-soft: #eaf1fe;
            --danger: #b42318;
            --danger-soft: #fdecea;
            --success: #12805c;
            --success-soft: #e7f6ef;
            --radius-sm: 8px;
            --radius-lg: 16px;
            --shadow-lg: 0 2px 6px rgba(15, 23, 42, 0.06), 0 24px 48px rgba(15, 23, 42, 0.12);
            --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            background-color: var(--bg-alt);
            background-image:
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 48px 48px;
            background-position: center;
            color: var(--text);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
            font-size: 15px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 36px 32px 32px;
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            background: var(--bg);
            box-shadow: var(--shadow-lg);
            animation: slideUp 300ms var(--ease);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            .login-container, .alert { animation: none; }
        }

        .logo-section { margin-bottom: 28px; }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.04em;
            color: var(--ink);
        }

        .brand-mark {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: var(--radius-sm);
            background: var(--primary);
            color: #fff;
            font-size: 15px;
        }

        .brand-acento { color: var(--primary); }

        .logo-section h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--ink);
        }

        .logo-section p {
            margin: 4px 0 0;
            color: var(--muted);
        }

        .form-group { margin-bottom: 18px; }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 500;
            color: var(--ink);
        }

        .form-group input {
            width: 100%;
            height: 44px;
            padding: 0 14px;
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);
            background: var(--bg);
            color: var(--ink);
            font: inherit;
            transition: border-color 150ms var(--ease), box-shadow 150ms var(--ease);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(29, 91, 216, 0.15);
        }

        .form-group input::placeholder { color: var(--subtle); }

        .remember-forgot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 24px;
            font-size: 14px;
        }

        .remember-forgot label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--muted);
            cursor: pointer;
        }

        .remember-forgot input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
        }

        .remember-forgot a {
            color: var(--primary);
            font-weight: 500;
            text-decoration: none;
        }

        .remember-forgot a:hover { text-decoration: underline; }

        .login-btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            height: 46px;
            border: 0;
            border-radius: var(--radius-sm);
            background: var(--primary);
            box-shadow: 0 1px 2px rgba(29, 91, 216, 0.3);
            color: #fff;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 150ms var(--ease);
        }

        .login-btn:hover:not(:disabled) { background: var(--primary-hover); }

        .login-btn:disabled { opacity: 0.7; cursor: progress; }

        .login-btn:focus-visible,
        .remember-forgot a:focus-visible,
        .remember-forgot input:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 3px;
        }

        .login-btn .spinner {
            display: none;
            position: absolute;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        .login-btn.loading .spinner { display: block; }
        .login-btn.loading span { visibility: hidden; }

        @keyframes spin { to { transform: rotate(360deg); } }

        .login-ayuda {
            margin: 20px 0 0;
            padding-top: 18px;
            border-top: 1px solid var(--border);
            font-size: 13px;
            color: var(--muted);
            text-align: center;
        }

        .alert {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 18px;
            padding: 12px 14px;
            border: 1px solid transparent;
            border-radius: var(--radius-sm);
            font-size: 14px;
            animation: slideDown 200ms var(--ease);
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: none; }
        }

        .alert i { margin-top: 3px; }

        .alert.error { background: var(--danger-soft); border-color: #f3c5c0; color: var(--danger); }
        .alert.success { background: var(--success-soft); border-color: #bfe5d3; color: var(--success); }
        .alert.info { background: var(--primary-soft); border-color: #cddcfb; color: #1e3a8a; }
        .alert.warning { background: #fdf3e2; border-color: #f2d9ab; color: #a15c07; }

        @media (max-width: 480px) {
            .login-container { padding: 28px 20px 24px; }
        }
    </style>
</head>
<body>
    <main class="login-container">
        <div class="logo-section">
            <div class="brand"><span class="brand-mark" aria-hidden="true"><i class="fas fa-plus"></i></span><span>ZENTRA <span class="brand-acento">MED</span></span></div>
            <h1>Iniciar sesión</h1>
            <p>Ingresa con tu correo y contraseña.</p>
        </div>

        <div id="alertContainer" role="status" aria-live="polite"></div>

        <form id="loginForm" novalidate>
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="tu@correo.com"
                    required
                    autocomplete="email"
                >
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    autocomplete="current-password"
                >
            </div>

            <div class="remember-forgot">
                <label>
                    <input type="checkbox" name="rememberMe">
                    Recordar correo
                </label>
                <a href="#" onclick="showForgotPassword(event)">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="login-btn">
                <span>Iniciar sesión</span>
                <div class="spinner" aria-hidden="true"></div>
            </button>
        </form>

        <p class="login-ayuda">¿No tienes cuenta? Pídele al administrador del sistema que te cree un usuario.</p>
    </main>

    <script src="js/auth-utils.js?v=20261018-1"></script>
    <script src="js/login.js?v=20261018-1"></script>
</body>
</html>
